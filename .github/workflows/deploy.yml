name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alltools-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ci-deploy
    steps:
      - uses: actions/checkout@v6
      - name: Configure deployment SSH key
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          cat deploy/known_hosts >> "$HOME/.ssh/known_hosts"
          # Server builds can stay silent for minutes; keep the session alive.
          printf 'Host deploy-target\n  HostName %s\n  Port %s\n  User %s\n  IdentityFile %s\n  ServerAliveInterval 30\n  ServerAliveCountMax 12\n  ConnectTimeout 15\n' \
            "$DEPLOY_HOST" "$DEPLOY_PORT" "$DEPLOY_USER" "$HOME/.ssh/id_ed25519" > "$HOME/.ssh/config"
      - name: Upload immutable release
        env:
          RELEASE_ID: ${{ github.sha }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_PORT"
          ssh deploy-target "mkdir -p /opt/alltools/releases/$RELEASE_ID"
          rsync --archive --delete \
            --exclude=.git \
            --exclude=.github \
            --exclude=.learnings \
            --exclude=.next \
            --exclude=node_modules \
            --exclude=.env \
            --exclude='.env.*' \
            --rsh="ssh -F $HOME/.ssh/config" \
            ./ "deploy-target:/opt/alltools/releases/$RELEASE_ID/"
      - name: Build, activate, and health-check release
        env:
          RELEASE_ID: ${{ github.sha }}
        run: ssh deploy-target "sudo -n /usr/local/sbin/alltools-deploy $RELEASE_ID"
