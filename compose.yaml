services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in the deployment environment.}
        NEXT_PUBLIC_PRIVATE_QUERY_URL: ${NEXT_PUBLIC_PRIVATE_QUERY_URL:-}
    image: alltools:${RELEASE_ID:-local}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      TRANSFER_DATA_DIR: /data/transfer
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ALLTOOLS_AI_DAILY_LIMIT: ${ALLTOOLS_AI_DAILY_LIMIT:-}
      ALLTOOLS_ASR_URL: ${ALLTOOLS_ASR_URL:-http://asr:8000}
      ALLTOOLS_REMBG_URL: ${ALLTOOLS_REMBG_URL:-http://rembg:8000}
    read_only: true
    volumes:
      - transfer_data:/data/transfer
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all(['/', '/api/transfer/session'].map(p => fetch('http://127.0.0.1:3000'+p))).then(rs => process.exit(rs.every(r => r.ok) ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  transfer-maintenance:
    image: alltools:${RELEASE_ID:-local}
    init: true
    restart: unless-stopped
    command: ["node", "scripts/transfer-maintenance.mjs"]
    environment:
      TRANSFER_DATA_DIR: /data/transfer
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - transfer_data:/data/transfer
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  asr:
    build:
      context: ./asr
    image: alltools-asr:${RELEASE_ID:-local}
    init: true
    restart: unless-stopped
    environment:
      ASR_MODEL_SIZE: ${ASR_MODEL_SIZE:-base}
      OMP_NUM_THREADS: "2"
      HF_HOME: /models/.cache
      XDG_CACHE_HOME: /models/.cache
      HF_HUB_DISABLE_XET: "1"
      HOME: /models/home
    volumes:
      - asr-models:/models
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 400s

  rembg:
    build:
      context: ./rembg
    image: alltools-rembg:${RELEASE_ID:-local}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  gateway:
    image: caddy:2.10.2-alpine
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${ALLTOOLS_BIND_ADDRESS:-0.0.0.0}:${ALLTOOLS_PORT:-9999}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /data
      - /config
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default:
      chaxun_shared:

volumes:
  asr-models:
  transfer_data:

networks:
  chaxun_shared:
    external: true
    name: chaxun_shared
