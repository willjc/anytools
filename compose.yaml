services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?Set NEXT_PUBLIC_SITE_URL in the deployment environment.}
        NEXT_PUBLIC_PRIVATE_QUERY_URL: ${NEXT_PUBLIC_PRIVATE_QUERY_URL:-}
    image: alltools:${RELEASE_ID:-local}
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ALLTOOLS_AI_DAILY_LIMIT: ${ALLTOOLS_AI_DAILY_LIMIT:-}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: caddy:2.10.2-alpine
    init: true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${ALLTOOLS_BIND_ADDRESS:-0.0.0.0}:${ALLTOOLS_PORT:-9999}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /data
      - /config
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      default:
      chaxun_shared:

networks:
  chaxun_shared:
    external: true
    name: chaxun_shared
